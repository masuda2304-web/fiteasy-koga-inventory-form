<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>採用・契約管理</title>
<style>
  :root {
    --navy: #1f3864; --navy-2: #2f5597; --bg: #f4f6fa; --card: #fff; --line: #e1e6ef;
    --text: #1d2433; --muted: #66708a;
    --red: #c62828; --red-bg: #fdecea; --amber: #b26a00; --amber-bg: #fff4e0;
    --green: #2e7d32; --green-bg: #e8f5e9; --blue-bg: #e8eefb; --gray-bg: #eef0f4;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif; font-size: 15px; line-height: 1.6; }
  header { background: var(--navy); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 20; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; white-space: nowrap; }
  header .user { margin-left: auto; font-size: 12px; opacity: .8; }
  nav.tabs { display: flex; gap: 4px; }
  nav.tabs button { background: transparent; color: #cfd8ea; border: 0; padding: 8px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; }
  nav.tabs button.active { background: rgba(255,255,255,.16); color: #fff; font-weight: 700; }
  nav.tabs .badge { margin-left: 6px; }
  nav.tabs .sm { display: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 96px; }
  .banner { background: var(--amber-bg); color: var(--amber); padding: 8px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  h2 { font-size: 20px; margin: 4px 0 14px; }
  h3 { font-size: 16px; margin: 22px 0 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--card); border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--line); cursor: pointer; text-align: left; font-family: inherit; color: inherit; }
  .tile .n { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .tile .l { font-size: 13px; color: var(--muted); }
  .tile.red .n { color: var(--red); } .tile.amber .n { color: var(--amber); } .tile.green .n { color: var(--green); } .tile.blue .n { color: var(--navy-2); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; background: var(--gray-bg); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-size: 13px; cursor: pointer; font-family: inherit; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--text); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .btn { border: 1px solid var(--line); background: #fff; padding: 7px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; color: var(--text); text-decoration: none; display: inline-block; }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 700; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .spacer { flex: 1; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
  .b-red { background: var(--red-bg); color: var(--red); } .b-amber { background: var(--amber-bg); color: var(--amber); }
  .b-green { background: var(--green-bg); color: var(--green); } .b-blue { background: var(--blue-bg); color: var(--navy-2); }
  .b-gray { background: var(--gray-bg); color: var(--muted); }

  /* 契約カード */
  .staff { display: grid; grid-template-columns: 110px 1fr auto; gap: 14px; align-items: center; }
  .days { text-align: center; border-radius: 10px; padding: 8px 4px; }
  .days .d { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .days .u { font-size: 12px; }
  .days.expired { background: var(--red-bg); color: var(--red); }
  .days.soon { background: var(--amber-bg); color: var(--amber); }
  .days.ok { background: var(--green-bg); color: var(--green); }
  .days.missing, .days.retired { background: var(--gray-bg); color: var(--muted); }
  .staff .name { font-weight: 700; font-size: 16px; }
  .staff .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .staff .tags { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .bar { height: 6px; background: var(--gray-bg); border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--navy-2); }
  .actions { display: flex; flex-direction: column; gap: 6px; }
  .month { font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }

  /* フロー */
  .phase { font-size: 13px; font-weight: 700; color: var(--navy-2); margin: 22px 0 8px; letter-spacing: .05em; }
  .flow { position: relative; }
  .step { display: grid; grid-template-columns: 44px 1fr; gap: 12px; position: relative; }
  .step:not(:last-child)::before { content: ""; position: absolute; left: 21px; top: 44px; bottom: -10px; width: 2px; background: var(--line); }
  .num { width: 44px; height: 44px; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 17px; z-index: 1; }
  .step .card { cursor: pointer; }
  .step .card:hover { border-color: #b9c6e0; }
  .step .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .step .title { font-weight: 700; font-size: 16px; }
  .step .sum { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .roles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .detail { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; cursor: default; }
  .detail h4 { font-size: 13px; margin: 12px 0 6px; color: var(--navy-2); }
  .detail h4:first-child { margin-top: 0; }
  .proc { display: grid; grid-template-columns: 26px 1fr; gap: 8px; margin-bottom: 10px; }
  .proc .k { width: 24px; height: 24px; border-radius: 50%; background: var(--blue-bg); color: var(--navy-2); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .proc .rule { font-size: 13px; color: var(--muted); }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 3px 0; }
  .check input { margin-top: 5px; width: 16px; height: 16px; }
  .tmpl { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 8px; position: relative; }
  .tmpl b { display: block; font-size: 13px; margin-bottom: 2px; }
  .tmpl .btn { position: absolute; top: 8px; right: 8px; }
  .rule-box { background: var(--red-bg); color: #7a1c1c; border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 8px; }

  /* 応募者 */
  .appl { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; cursor: pointer; }
  .mini-steps { display: flex; gap: 3px; margin-top: 8px; }
  .mini-steps i { flex: 1; height: 5px; border-radius: 99px; background: var(--gray-bg); }
  .mini-steps i.done { background: var(--green); }
  .mini-steps i.now { background: var(--amber); }
  .todo { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  /* モーダル */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; z-index: 50; padding: 30px 12px; overflow-y: auto; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 640px; padding: 20px; }
  .modal h3 { margin-top: 0; }
  .form-sec { font-size: 13px; font-weight: 700; color: var(--navy-2); margin: 16px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  label.f { display: block; font-size: 12px; color: var(--muted); }
  label.f.wide { grid-column: 1 / -1; }
  label.f input, label.f select, label.f textarea { display: block; width: 100%; margin-top: 3px; font-size: 15px; padding: 7px 9px; border: 1px solid #cfd6e3; border-radius: 8px; font-family: inherit; color: var(--text); background: #fff; }
  label.f textarea { min-height: 70px; }
  label.f .hint { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .preview { background: var(--blue-bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1d2433; color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 14px; z-index: 60; }
  .toast.err { background: var(--red); }
  .loading { text-align: center; padding: 60px; color: var(--muted); }

  #print-root { display: none; }
  .modal .foot.left { justify-content: space-between; }
  .q-cat { font-weight: 700; color: var(--navy-2); font-size: 14px; margin: 18px 0 6px; padding: 4px 8px; background: #fff7d6; border-radius: 6px; }
  .q { margin-bottom: 12px; }
  .q .qt { font-size: 14px; margin-bottom: 4px; }
  .q textarea { width: 100%; min-height: 52px; font-size: 14px; padding: 6px 8px; border: 1px solid #cfd6e3; border-radius: 8px; font-family: inherit; }
  .q input { width: 100%; font-size: 13px; padding: 5px 8px; border: 1px solid #e1e6ef; border-radius: 8px; margin-top: 4px; font-family: inherit; }
  @media print {
    @page { size: A4; margin: 14mm 16mm; }
    body.printing > *:not(#print-root) { display: none !important; }
    body.printing { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.printing #print-root { display: block; }
  }
  .doc { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; color: #000; font-size: 10.5pt; line-height: 1.75; }
  .doc h1 { text-align: center; font-size: 17pt; letter-spacing: .3em; margin: 4px 0 14px; }
  .doc .kind { font-size: 10pt; }
  .doc .art { font-weight: 700; margin: 10px 0 2px; }
  .doc .row { display: grid; grid-template-columns: 54px 1fr; }
  .doc .sub { padding-left: 54px; }
  .doc .ind { padding-left: 1.2em; }
  .doc table { border-collapse: collapse; margin: 4px 0 4px 54px; }
  .doc td, .doc th { border: 1px solid #000; padding: 2px 14px; text-align: center; font-weight: normal; }
  .doc .sign { margin-top: 18px; }
  .doc .sign .party { display: grid; grid-template-columns: 40px 1fr 40px; margin-top: 10px; }
  .doc .fill { border-bottom: 1px solid #000; padding: 0 6px; }
  .doc .pb { break-before: page; }
  .isheet { font-size: 9.5pt; color: #000; font-family: inherit; }
  .isheet h1 { font-size: 15pt; margin: 0 0 6px; }
  .isheet .meta { display: flex; gap: 24px; margin-bottom: 8px; }
  .isheet table { width: 100%; border-collapse: collapse; }
  .isheet th, .isheet td { border: 1px solid #555; padding: 4px 6px; vertical-align: top; text-align: left; }
  .isheet th { background: #e8e8e8; }
  .isheet td.cat { background: #fff2a8; font-weight: 700; }
  .isheet td.ans { height: 34px; }
  @media (max-width: 760px) {
    header { padding: 10px 14px; }
    header .user { display: none; }
    nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); justify-content: space-around; padding: 4px 2px calc(4px + env(safe-area-inset-bottom)); z-index: 30; }
    nav.tabs button { color: var(--muted); font-size: 12px; padding: 8px 4px; flex: 1; }
    nav.tabs button.active { background: var(--blue-bg); color: var(--navy); }
    nav.tabs .lg { display: none; } nav.tabs .sm { display: inline; }
    .staff { grid-template-columns: 76px 1fr; }
    .staff .actions { grid-column: 1 / -1; flex-direction: row; }
    .days .d { font-size: 22px; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<main id="main"><div class="loading">読み込み中…</div></main>
<div id="modal-root"></div>
<div id="print-root"></div>

/* ===================================================================
 * 日付・計算
 * =================================================================== */
function pd(s) { if (!s) return null; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function ymd(d) { return d ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') : ''; }
function jp(d) { if (!d) return '—'; return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'[d.getDay()] + '）'; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function addMonths(d, n) { // ExcelのEDATEと同じ（月末を超えたら月末に寄せる）
  const y = d.getFullYear(), m = d.getMonth() + n, day = d.getDate();
  const last = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(day, last));
}
function diff(a, b) { return Math.round((a - b) / 86400000); }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function calcStaff(s) {
  const st = S.settings, t = S.today;
  const hire = pd(s.F), signed = pd(s.M), months = Number(s.N) || 0;
  const trialEnd = hire ? addDays(addMonths(hire, st.trialMonths), -1) : null;
  const expiry = signed && months ? addDays(addMonths(signed, months), -1) : null;
  const days = expiry ? diff(expiry, t) : null;
  const quitDate = pd(s.AA);
  const retired = s.E === '退職' || (quitDate && quitDate < t);
  const birth = pd(s.V);
  let age = null;
  if (birth) { age = t.getFullYear() - birth.getFullYear(); if (t < new Date(t.getFullYear(), birth.getMonth(), birth.getDate())) age--; }
  const leaveDate = pd(s.AB) || (hire ? addMonths(hire, PAID_LEAVE_MONTHS) : null);
  const leaveIn = leaveDate ? diff(leaveDate, t) : null;
  let level;
  if (retired) level = 'retired';
  else if (days === null) level = 'missing';
  else if (days < 0) level = 'expired';
  else if (days <= st.alertDays) level = 'soon';
  else level = 'ok';
  const score = s.J === '' || s.J === null || s.J === undefined ? null : Number(s.J);
  const test = score === null ? '未受験' : score >= st.passLine ? '合格' : '不合格';
  const inTrial = !retired && trialEnd && t <= trialEnd;
  const total = signed && expiry ? diff(expiry, signed) + 1 : 0;
  const progress = total ? Math.min(1, Math.max(0, (diff(t, signed) + 1) / total)) : 0;
  return { hire, signed, months, trialEnd, expiry, days, level, score, test, inTrial, retired, progress, quitDate, age, leaveDate, leaveIn };
}

function calcApplicant(a) {
  const st = S.settings;
  let status;
  if (a.M === '不採用' || a.S === '不採用') status = '不採用';
  else if (a.M === '保留' || a.S === '保留') status = '保留';
  else if (a.Y) status = '初出勤日確定';
  else if (a.U) status = '入社準備中';
  else if (a.T) status = '採用連絡待ち';
  else if (a.O) status = '役員判断待ち';
  else if (a.M === '面接へ') status = '面接日程調整中';
  else if (a.L) status = '書類選考中';
  else status = '応募受付';
  const D = pd(a.D), O = pd(a.O), T = pd(a.T), U = pd(a.U);
  const due = {
    '応募受付': D && addDays(D, st.firstContactDays),
    '書類選考中': D && addDays(D, st.screeningDays),
    '面接日程調整中': D && addDays(D, st.interviewDays),
    '役員判断待ち': O && addDays(O, st.decisionDays),
    '採用連絡待ち': T && addDays(T, st.notifyDays),
    '入社準備中': U && addDays(U, st.firstDayDays),
  }[status] || null;
  const row = st.statusTable.find(r => r.status === status);
  const overdue = due && diff(due, S.today) < 0;
  const steps = [
    !!(a.K && a.L), !!(a.M === '面接へ' || a.O), !!a.O, !!(a.O && a.Q), !!a.R, !!a.S,
    !!a.U && (a.S !== '採用' || a.V === '済'), !!(a.W === '済' && a.X === '済' && a.Y),
  ];
  const closed = status === '不採用' || status === '初出勤日確定';
  return { status, due, overdue, action: row ? row.action : '', steps, closed };
}

    document.getElementById('user').textContent = d.user || '';
    render();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="card"><b>読み込めませんでした。</b><div class="muted">' + esc(e.message || e) +
      '</div><div class="muted">管理表の閲覧・編集権限があるか確認してください。</div></div>';
  }
}

function go(view, opts) { Object.assign(S, { view }, opts || {}); render(); window.scrollTo(0, 0); }

function render() {
  const staffCalc = S.staff.map(s => ({ s, c: calcStaff(s) }));
  const needContract = staffCalc.filter(x => ['expired', 'soon', 'missing'].includes(x.c.level)).length;
  const applCalc = S.applicants.map(a => ({ a, c: calcApplicant(a) }));
  const overdue = applCalc.filter(x => x.c.overdue).length;
  document.getElementById('tabs').innerHTML = VIEWS.map(([k, l, sl]) => {
    const n = k === 'contracts' ? needContract : k === 'applicants' ? overdue : 0;
    return '<button class="' + (S.view === k ? 'active' : '') + '" onclick="go(\'' + k + '\')"><span class="lg">' + l + '</span><span class="sm">' + sl + '</span>' +
      (n ? '<span class="badge b-red">' + n + '</span>' : '') + '</button>';
  }).join('');
  const html = { home: viewHome, contracts: viewContracts, flow: viewFlow, applicants: viewApplicants }[S.view](staffCalc, applCalc);
  document.getElementById('main').innerHTML = (IS_GAS ? '' : '<div class="banner">サンプルデータで表示しています（スプレッドシートには保存されません）</div>') + html;
}

function storeSeg() {
  const stores = [''].concat(S.settings.stores.map(s => s.name));
  return '<div class="seg">' + stores.map(n => '<button class="' + (S.store === n ? 'on' : '') + '" onclick="S.store=\'' + esc(n) + '\';render()">' + (n || '全店') + '</button>').join('') + '</div>';
}
function byStore(list, key) { return S.store ? list.filter(x => x[key].B === S.store) : list; }

/* ---------- ホーム ---------- */
function viewHome(staffCalc, applCalc) {
  const sc = byStore(staffCalc, 's'), ac = byStore(applCalc, 'a');
  const active = sc.filter(x => !x.c.retired);
  const expired = active.filter(x => x.c.level === 'expired');
  const soon = active.filter(x => x.c.level === 'soon');
  const missing = active.filter(x => x.c.level === 'missing');
  const trialEnding = active.filter(x => x.c.inTrial && x.c.test !== '合格' && diff(x.c.trialEnd, S.today) <= 7);
  const overdue = ac.filter(x => x.c.overdue);
  const dueToday = ac.filter(x => x.c.due && diff(x.c.due, S.today) === 0);
  const openAppl = ac.filter(x => !x.c.closed);

  const todos = [];
  expired.forEach(x => todos.push(['b-red', '契約期限切れ', x.s.C + '（' + x.s.B + '）満了日 ' + jp(x.c.expiry), "go('contracts',{contractFilter:'action'})"]));
  trialEnding.forEach(x => todos.push(['b-red', '試用期間まもなく満了', x.s.C + '（' + x.s.B + '）人事テスト：' + x.c.test + '／満了 ' + jp(x.c.trialEnd), "go('contracts',{contractFilter:'trial'})"]));
  overdue.forEach(x => todos.push(['b-red', '応募対応の期限超過', x.a.C + '（' + x.a.B + '）' + x.c.action, "openApplicant(" + x.a.row + ")"]));
  dueToday.forEach(x => todos.push(['b-amber', '今日が期限', x.a.C + '（' + x.a.B + '）' + x.c.action, "openApplicant(" + x.a.row + ")"]));
  soon.forEach(x => todos.push(['b-amber', '契約更新が近い', x.s.C + '（' + x.s.B + '）あと' + x.c.days + '日', "go('contracts',{contractFilter:'action'})"]));
  active.filter(x => x.c.leaveIn !== null && x.c.leaveIn >= 0 && x.c.leaveIn <= S.settings.alertDays)
    .forEach(x => todos.push(['b-green', '有給発生が近い', x.s.C + '（' + x.s.B + '）' + jp(x.c.leaveDate) + 'に初回有給が発生', "openStaff(" + x.s.row + ")"]));
  active.filter(x => x.c.quitDate && x.c.quitDate >= S.today)
    .forEach(x => todos.push(['b-gray', '退職予定', x.s.C + '（' + x.s.B + '）' + jp(x.c.quitDate), "openStaff(" + x.s.row + ")"]));
  missing.forEach(x => todos.push(['b-gray', '契約情報が未登録', x.s.C + '（' + x.s.B + '）締結日・契約期間を入れてください', "openStaff(" + x.s.row + ")"]));

  return '<div class="toolbar"><h2 style="margin:0">今日の状況</h2><span class="spacer"></span>' + storeSeg() + '</div>' +
    '<div class="tiles">' +
    tile('red', expired.length, '契約 期限切れ', "go('contracts',{contractFilter:'action'})") +
    tile('amber', soon.length, '契約 更新が近い（' + S.settings.alertDays + '日以内）', "go('contracts',{contractFilter:'action'})") +
    tile('blue', active.filter(x => x.c.inTrial).length, '試用期間中', "go('contracts',{contractFilter:'trial'})") +
    tile('green', active.length, '在籍スタッフ', "go('contracts',{contractFilter:'active'})") +
    tile(overdue.length ? 'red' : 'blue', openAppl.length, '選考中の応募者' + (overdue.length ? '（期限超過 ' + overdue.length + '）' : ''), "go('applicants')") +
    '</div>' +
    '<h3>やること</h3>' +
    (todos.length ? todos.map(t => '<div class="card todo" style="cursor:pointer" onclick="' + t[3] + '"><span class="badge ' + t[0] + '">' + esc(t[1]) + '</span><span>' + esc(t[2]) + '</span><span class="muted">›</span></div>').join('')
      : '<div class="card empty">対応が必要なものはありません</div>') +
    '<p class="muted" style="margin-top:18px">データは管理表（Googleスプレッドシート）に保存されています。' +
    (S.sheetUrl && S.sheetUrl !== '#' ? '<a href="' + esc(S.sheetUrl) + '" target="_blank">管理表を開く</a>' : '') + '</p>';
}
function tile(color, n, label, onclick) {
  return '<button class="tile ' + color + '" onclick="' + onclick + '"><div class="n">' + n + '</div><div class="l">' + esc(label) + '</div></button>';
}

/* ---------- 契約更新 ---------- */
function viewContracts(staffCalc) {
  let list = byStore(staffCalc, 's');
  const f = S.contractFilter;
  if (f === 'action') list = list.filter(x => ['expired', 'soon', 'missing'].includes(x.c.level));
  else if (f === 'trial') list = list.filter(x => x.c.inTrial);
  else if (f === 'active') list = list.filter(x => !x.c.retired);
  const order = { expired: 0, soon: 1, missing: 2, ok: 3, retired: 4 };
  list.sort((a, b) => order[a.c.level] - order[b.c.level] || (a.c.days ?? 99999) - (b.c.days ?? 99999));

  const seg = [['action', '要対応'], ['trial', '試用期間中'], ['active', '在籍全員'], ['all', '退職者を含む']];
  let body = '';
  if (!list.length) body = '<div class="card empty">該当するスタッフはいません</div>';
  else if (f === 'active' || f === 'all') {
    // 満了月ごとにまとめて表示
    let lastKey = null;
    list.forEach(x => {
      const key = x.c.level === 'expired' ? '期限切れ' : x.c.level === 'missing' ? '契約情報が未登録' : x.c.level === 'retired' ? '退職' :
        x.c.expiry.getFullYear() + '年' + (x.c.expiry.getMonth() + 1) + '月に満了';
      if (key !== lastKey) { body += '<div class="month">' + key + '</div>'; lastKey = key; }
      body += staffCard(x);
    });
  } else body = list.map(staffCard).join('');

  return '<div class="toolbar"><h2 style="margin:0">契約更新</h2><span class="spacer"></span>' +
    '<button class="btn primary" onclick="openStaff()">＋ スタッフを登録</button></div>' +
    '<div class="toolbar">' + storeSeg() +
    '<div class="seg">' + seg.map(([k, l]) => '<button class="' + (f === k ? 'on' : '') + '" onclick="S.contractFilter=\'' + k + '\';render()">' + l + '</button>').join('') + '</div></div>' +
    '<p class="muted">満了日の' + S.settings.alertDays + '日前から「更新が近い」になります。日数は管理表の「設定」タブで変えられます。</p>' + body;
}

function staffCard(x) {
  const s = x.s, c = x.c;
  const dayBox = {
    expired: '<div class="d">' + Math.abs(c.days) + '</div><div class="u">日超過</div>',
    soon: '<div class="u">あと</div><div class="d">' + c.days + '</div><div class="u">日</div>',
    ok: '<div class="u">あと</div><div class="d">' + c.days + '</div><div class="u">日</div>',
    missing: '<div class="u">契約情報</div><div class="d">—</div><div class="u">未登録</div>',
    retired: '<div class="u">退職</div>',
  }[c.level];
  const tags = [];
  if (c.inTrial) tags.push('<span class="badge b-blue">試用期間中（' + jp(c.trialEnd) + 'まで）</span>');
  if (!c.retired && (c.inTrial || c.test !== '合格')) tags.push('<span class="badge ' + (c.test === '合格' ? 'b-green' : c.test === '不合格' ? 'b-red' : 'b-gray') + '">人事テスト ' + c.test + (c.score !== null ? ' ' + Math.round(c.score * 100) + '%' : '') + '</span>');
  if (s.R === '未') tags.push('<span class="badge b-amber">振込先 未登録</span>');
  if (!c.retired && c.leaveIn !== null && c.leaveIn >= 0 && c.leaveIn <= S.settings.alertDays) tags.push('<span class="badge b-green">有給発生 ' + jp(c.leaveDate) + '</span>');
  if (c.quitDate) tags.push('<span class="badge b-gray">' + (c.retired ? '退職 ' : '退職予定 ') + jp(c.quitDate) + '</span>');
  const isTrialContract = c.months === S.settings.trialMonths;
  return '<div class="card staff">' +
    '<div class="days ' + c.level + '">' + dayBox + '</div>' +
    '<div><div class="name">' + esc(s.C) + ' <span class="muted">' + esc(s.B) + '・' + esc(s.D || '') + '</span></div>' +
    (s.U ? '<div class="muted" style="margin-top:-3px">' + esc(s.U) + '</div>' : '') +
    '<div class="meta"><span>契約 ' + jp(c.signed) + ' 〜 ' + jp(c.expiry) + (c.months ? '（' + c.months + 'か月' + (isTrialContract ? '・試用' : '') + '）' : '') + '</span>' +
    '<span>入社 ' + jp(c.hire) + '</span>' +
    (s.AC ? '<span>時給 ' + Number(s.AC).toLocaleString() + '円</span>' : '') +
    (c.age !== null ? '<span>' + c.age + '歳</span>' : '') +
    (s.W ? '<span>☎ <a href="tel:' + esc(s.W) + '">' + esc(s.W) + '</a></span>' : '') + '</div>' +
    (tags.length ? '<div class="tags">' + tags.join('') + '</div>' : '') +
    (c.expiry && !c.retired ? '<div class="bar"><i style="width:' + Math.round(c.progress * 100) + '%"></i></div>' : '') +
    (s.T ? '<div class="muted" style="margin-top:4px">' + esc(s.T) + '</div>' : '') + '</div>' +
    '<div class="actions">' +
    (!c.retired ? '<button class="btn small primary" onclick="' + (c.level === 'missing' ? 'openStaff' : 'openRenew') + '(' + s.row + ')">' + (c.level === 'missing' ? '契約を登録' : '更新を記録') + '</button>' : '') +
    '<button class="btn small" onclick="openStaff(' + s.row + ')">編集</button>' +
    (!c.retired ? '<button class="btn small" onclick="openContract(' + s.row + ')">契約書を作成</button>' : '') +
    (s.L ? '<a class="btn small" href="' + esc(s.L) + '" target="_blank" rel="noopener">契約書</a>' : '') +
    '</div></div>';
}

function openRenew(row) {
  const s = S.staff.find(r => r.row === row), c = calcStaff(s), st = S.settings;
  const start = c.expiry ? addDays(c.expiry, 1) : S.today;
  const months = c.months === st.trialMonths ? st.standardMonths : (c.months || st.standardMonths);
  const warn = c.months === st.trialMonths && c.test !== '合格'
    ? '<div class="rule-box">人事テストが「' + c.test + '」です。8割以上で合格してから本契約を結ぶルールです。</div>' : '';
  modal('<h3>契約更新を記録：' + esc(s.C) + '</h3>' + warn +
    '<p class="muted">現在の契約：' + jp(c.signed) + ' 〜 ' + jp(c.expiry) + (c.months ? '（' + c.months + 'か月）' : '') + '</p>' +
    '<div class="grid2">' +
    '<label class="f">新しい契約締結日<input type="date" id="rn-date" value="' + ymd(start) + '" oninput="renewPreview()"></label>' +
    '<label class="f">契約期間（か月）<input type="number" min="1" id="rn-months" value="' + months + '" oninput="renewPreview()"></label>' +
    '<label class="f wide">新しい雇用契約書のURL<input type="url" id="rn-url" placeholder="https://"></label></div>' +
    '<div class="preview" id="rn-preview"></div>' +
    '<p class="muted">これまでの契約書URLは備考に残します。</p>' +
    '<div class="foot"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" id="rn-save" onclick="saveRenew(' + row + ')">記録する</button></div>');
  renewPreview();
}
function renewPreview() {
  const d = pd(document.getElementById('rn-date').value), m = Number(document.getElementById('rn-months').value);
  document.getElementById('rn-preview').innerHTML = d && m > 0
    ? '新しい契約満了日（次回の更新期限）：<b>' + jp(addDays(addMonths(d, m), -1)) + '</b>' : '締結日と契約期間を入れてください';
}
async function saveRenew(row) {
  const s = S.staff.find(r => r.row === row);
  const date = document.getElementById('rn-date').value, months = Number(document.getElementById('rn-months').value);
  const url = document.getElementById('rn-url').value.trim();
  if (!date || !(months > 0)) return toast('締結日と契約期間を入れてください', true);
  const data = { M: date, N: months };
  if (url) {
    data.L = url;
    if (s.L) data.T = ('旧契約書（' + (s.M || '') + '締結）: ' + s.L + (s.T ? '\n' + s.T : ''));
  }
  await save('staff', row, data, s.C, '契約更新を記録しました');
}

/* ---------- 共通フォーム ---------- */
function fieldHtml(f, v) {
  if (f.sec) return '<div class="form-sec" style="grid-column:1/-1">' + esc(f.sec) + '</div>';
  const id = 'fld-' + f.k, cls = 'f' + (f.wide ? ' wide' : '');
  const lab = esc(f.label) + (f.req ? ' <span style="color:var(--red)">*</span>' : '');
  if (v === null || v === undefined) v = '';
  let input;
  if (f.type === 'store' || f.type === 'select') {
    const opts = f.type === 'store' ? S.settings.stores.map(s => s.name) : f.opts;
    input = '<select id="' + id + '"><option value=""></option>' + opts.map(o => '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
  } else if (f.type === 'textarea') input = '<textarea id="' + id + '">' + esc(v) + '</textarea>';
  else if (f.type === 'percent') input = '<input type="number" min="0" max="100" step="1" id="' + id + '" value="' + (v === '' ? '' : Math.round(Number(v) * 100)) + '">';
  else {
    const type = { tel: 'tel', email: 'email', zip: 'text', kana: 'text' }[f.type] || f.type || 'text';
    const extra = f.type === 'zip' ? ' inputmode="numeric"' : '';
    input = '<input type="' + type + '" id="' + id + '" value="' + esc(v) + '"' + extra + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + '>';
  }
  if (f.type === 'textarea' && f.ph) input = input.replace('<textarea ', '<textarea placeholder="' + esc(f.ph) + '" ');
  return '<label class="' + cls + '">' + lab + input + (f.hint ? '<span class="hint">' + esc(f.hint) + '</span>' : '') + '</label>';
}
function toHalf(v) { return v.replace(/[０-９－ー―‐]/g, c => c === '－' || c === 'ー' || c === '―' || c === '‐' ? '-' : String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }
function readForm(fields) {
  const out = {};
  for (const f of fields.filter(f => f.k)) {
    let v = document.getElementById('fld-' + f.k).value.trim();
    if (f.type === 'number') {
      v = toHalf(v).replace(/,/g, '');
      if (v !== '' && isNaN(Number(v))) throw new Error(f.label + 'は数字で入れてください');
      v = v === '' ? '' : Number(v);
    }
    if (f.type === 'percent') v = v === '' ? '' : Number(toHalf(v)) / 100;
    if (f.type === 'kana') v = v.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
    if (f.type === 'tel' && v) {
      v = toHalf(v);
      if (!/^[0-9-]{10,13}$/.test(v)) throw new Error('電話番号は数字とハイフンで入れてください（例：090-1234-5678）');
    }
    if (f.type === 'zip' && v) {
      const d = toHalf(v).replace(/-/g, '');
      if (!/^\d{7}$/.test(d)) throw new Error('郵便番号は7桁で入れてください（例：123-4567）');
      v = d.slice(0, 3) + '-' + d.slice(3);
    }
    if (f.type === 'email' && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) throw new Error('メールアドレスの形式が正しくありません');
    out[f.k] = v;
  }
  return out;
}
function modal(html) {
  document.getElementById('modal-root').innerHTML = '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">' + html + '</div></div>';
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
async function save(kind, row, data, expectName, msg) {
  const btns = document.querySelectorAll('.modal .btn');
  btns.forEach(b => b.disabled = true);
  try {
    const r = await call('saveRow', kind, row || null, data, row ? expectName : undefined);
    S.staff = r.staff; S.applicants = r.applicants;
    closeModal(); render(); toast(msg || '保存しました');
  } catch (e) {
    btns.forEach(b => b.disabled = false);
    toast(e.message || String(e), true);
  }
}

function openStaff(row) {
  const s = row ? S.staff.find(r => r.row === row) : { B: S.store || '', E: '在籍', D: 'アルバイト', F: ymd(S.today), M: ymd(S.today), N: S.settings.trialMonths, R: '未' };
  modal('<h3>' + (row ? 'スタッフを編集：' + esc(s.C) : 'スタッフを登録') + '</h3>' +
    (row ? '' : '<p class="muted">初出勤日に試用期間（' + S.settings.trialMonths + 'か月）の契約を結んだら登録します。</p>') +
    '<div class="grid2">' + STAFF_FIELDS.map(f => fieldHtml(f, f.k ? s[f.k] : null)).join('') + '</div>' +
    '<div class="foot"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" onclick="saveStaff(' + (row || 0) + ')">保存</button></div>');
}
async function saveStaff(row) {
  let data;
  try { data = readForm(STAFF_FIELDS); } catch (e) { return toast(e.message, true); }
  if (!data.C) return toast('氏名を入れてください', true);
  if (!data.AB && pd(data.F)) data.AB = ymd(addMonths(pd(data.F), PAID_LEAVE_MONTHS));
  if (pd(data.AA) && pd(data.AA) <= S.today && data.E !== '退職') data.E = '退職';
  const s = row ? S.staff.find(r => r.row === row) : null;
  await save('staff', row, data, s ? s.C : undefined);
}

/* ---------- フロー・マニュアル ---------- */
function viewFlow() {
  let html = '<h2>採用フロー・マニュアル</h2><p class="muted">工程をタップすると、手順・ルール・チェックリスト・連絡文の例が開きます。</p>' +
    '<div class="card" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span class="muted">凡例</span>' +
    '<span class="badge b-blue">実施</span><span class="badge b-red">決裁（判断権限）</span><span class="badge b-gray">同席・協力</span></div>';
  PHASES.forEach(ph => {
    html += '<div class="phase">' + esc(ph.name) + '</div><div class="flow">';
    ph.steps.forEach(no => { html += stepHtml(STEPS.find(s => s.no === no)); });
    html += '</div>';
  });
  return html;
}
function stepHtml(st) {
  const open = S.openStep === st.no;
  const roles = st.do.map(r => '<span class="badge b-blue">' + esc(r) + '</span>').join('') +
    st.decide.map(r => '<span class="badge b-red">決裁：' + esc(r) + '</span>').join('') +
    st.support.map(r => '<span class="badge b-gray">' + esc(r) + '</span>').join('');
  let detail = '';
  if (open) {
    const checked = S.checks[st.no] || {};
    detail = '<div class="detail" onclick="event.stopPropagation()">' +
      (st.rule ? '<div class="rule-box">ルール：' + esc(st.rule) + '</div>' : '') +
      '<h4>手順</h4>' + st.procs.map((p, i) => '<div class="proc"><span class="k">' + (i + 1) + '</span><div>' + esc(p[0]) +
        (p[1] ? '<div class="rule">' + esc(p[1]) + '</div>' : '') + '</div></div>').join('') +
      '<h4>チェックリスト</h4>' + st.checks.map((c, i) => '<label class="check"><input type="checkbox" ' + (checked[i] ? 'checked' : '') +
        ' onchange="(S.checks[' + st.no + ']=S.checks[' + st.no + ']||{})[' + i + ']=this.checked">' + esc(c) + '</label>').join('') +

    '<div class="sub">6.　業務内容：' + f(k.work) + '<div class="ind">【変更の範囲】配置換え、職務転換等により会社内でのすべての業務（新たに設置される業務を含む）に変更することがあります。</div></div>' +
    art('労働条件', 3, '乙の労働条件は以下の通りとします') +
    '<div class="sub">①　出勤日：原則として週' + f(k.days) + '日勤務とし、各職場の勤務シフト表により定めます。1週間の所定労働時間は、平均して' + f(k.week) + '時間とします。</div>' +
    '<div class="sub">②　休日：少なくとも週1回の休日を付与するものとし、各職場の勤務シフト表により定めます。</div>' +
    '<div class="sub">③　休暇：法定通りに与えます。</div>' +
    '<div class="sub">④　就業時間等：乙の所定労働時間、始業・終業の時刻は、原則次の通りとして各職場の勤務シフト表により定めます。</div>' +
    '<table><tr><th>始業時刻</th><th>終業時刻</th><th>1日の所定労働時間</th></tr><tr><td>' + esc(k.start) + '</td><td>' + esc(k.end) + '</td><td>' + esc(k.dayh) + '時間</td></tr></table>' +
    '<div class="sub ind">始業及び終業時刻は、業務の都合により、事前に予告して当該勤務日の所定労働時間の範囲内で、職場の全部または一部または各人において変更することがあります。労働時間とはあくまで甲の指示、命令の基に、要求する業務に従事している時間を言います。甲の許可なく個人的判断で行っている任意の業務、または任意で行う業務技術向上のための訓練などは、労働時間として認識しません。</div>' +
    '<div class="sub">⑤　休憩時間：労働時間が6時間超は45分以上、8時間超は1時間以上を与えます。なお、業務量が増大し、社員への肉体的･精神的負担が強くなると代表が判断した場合は、休憩時間をさらにとらせる場合があります。</div>' +
    '<div class="sub">⑥　所定外労働時間：甲は、業務の都合により所定労働時間外、または休日に労働を命ずることがあります。</div>' +
    '<div class="sub">2.　業務の都合により、やむを得ない場合は、前各号の事項について変更することがあります。その場合、甲は乙に対して、事前に通知するものとします。</div>' +
    art('給与', 4, '甲は、乙により労務の提供があった期間あるいはその業務の量に対し、次に定められた給与を支払うものとします。') +
    '<div class="sub">1.　基本給：' + f(yen(k.wage)) + '円（時給）　交通費：' + f(yen(k.fare)) + '円</div>' +
    '<div class="sub">2.　割増賃金：時間外手当、深夜手当、休日手当は、法定外の労働時間、深夜時間に勤務すること、あるいは法定休日に就業することを命ぜられ、または承認を得て、その勤務に服した乙に支給します。</div>' +
    '<div class="sub">3.　賃金控除：甲は乙の給与から源泉所得税・住民税・対象者については雇用保険料・社会保険料被保険者負担分を毎月控除します。</div>' +
    '<div class="sub">4.　給与支払日：給与（賞与を除く）は、毎月末に締め切って計算し、翌月20日（その日が金融機関の営業休業日である場合はその前日）に支払います。</div>' +
    '<div class="sub">5.　昇給・降給：甲の経営状態、乙の勤務成績・経験等を考慮して昇給または降給を決定します。</div>' +
    '<div class="sub">6.　賞与：賞与は甲の業績に応じ、乙の勤務成績、能力評価など総合的に勘案し、支給の有無、金額を個別に決定します。</div>' +
    '<div class="sub">7.　退職金：退職金制度はありません。</div>' +
    art('人事異動等', 5, '乙は採用にあたっては、第2条（雇用契約）に定められた場所及び業務内容で就業しますが、甲の業務上の必要に応じ、配置転換、転勤及び出向（業務派遣を含む）等の人事異動命令並びに勤務形態等の変更命令に従わなければなりません。') +
    art('休職', 6, '就業規則の定める通りとします。') +
    art('退職・解雇', 7, '甲は、甲の定める就業規則に従い、乙に対し普通解雇、休職期間満了退職、懲戒解雇等を行うことがあります。その場合には甲は、解雇日1か月前に乙に通知するよう努めるものとします。') +
    '<div class="sub">2.　解雇の事由については、甲の就業規則の定めるところによります。</div>' +
    '<div class="sub">3.　自己の都合で退職しようとする場合は、退職する少なくとも1か月以上前までに甲に届出るものとします。</div>' +
    '<div class="sub">4.　乙は、退職または解雇の場合、甲からの貸与品及び債務を退職日までに完納しなければなりません。</div>' +
    '<div class="sub">5.　乙は、退職または解雇の場合、業務上の資料等全ての書類及び電子データを甲に返納しなければなりません。また、甲の許可なく廃棄してはなりません。</div>' +
    '<div class="sub">6.　乙は、退職届と退職時の合意書を提出しなければなりません。</div>' +
    art('安全衛生義務', 8, '乙は、甲の定める安全衛生に関する規定及び指示事項を守り、自己の安全遵守に留意し、自己または同僚に危険を与える行為を行ってはいけません。また、所定の衛生事項を遵守し、自己の日常の健康保持に努めるものとします。') +
    '<div class="sub">2.　甲は乙に対し、毎年1回の健康診断を実施し、乙は必ず受診しなければなりません。ただし週所定労働時間が正社員の4分の3未満の者を除きます。</div>' +
    '<div class="sub">3.　労働安全衛生の観点から、甲の指定する医師による健康診断または予防接種等を求める場合があります。</div>' +
    '<div class="sub">4.　乙が労働安全衛生法に定める健康診断等を拒否した場合、労務提供拒否または懲戒処分の対象となる場合がありますので、注意して下さい。</div>' +
    '<div class="sub">5.　健康診断の結果、必要がある場合は医師の診断に従って就業を一定期間禁止し、または就業場所の転換、業務の転換、労働時間の短縮その他健康保護に必要な処置を命じることがあります。乙はこれに従わなければなりません。</div>' +
    art('契約外の事項', 9, '本契約に定めのない事項については、甲の就業規則の定めるところによります。') +
    art('相談窓口', 10, '雇用管理の改善等に関する相談窓口は、代表取締役および総務担当管理職とします。') +
    art('紛争の解決', 11, '本雇用契約について甲と乙の間に紛争が生じた場合には、甲の就業規則に従い、双方誠意をもって自主的な紛争の解決を図るものとします。') +
    art('合意管轄', 12, '甲および乙は、万一前条にて解決せず、紛争が生じた場合、本雇用契約に関する訴訟の管轄裁判所は、甲の本店所在地を管轄する地方裁判所とします。') +
    '<div class="art">付記事項</div><div>・雇用契約上の地位に関する問題と賃金（残業代等を含む）に関する債権債務について一切の紛争が存在しないことを確認します。</div>' +
    '<div class="sign"><p>本契約の成立を証するため本書を' + CONTRACT_DEFAULTS.copies + '通作成し、甲乙双方の署名、または記名押印のうえ各1通を保有します。また、乙は、甲の提示した上記雇用契約書及び付記事項に記載された一切について承諾したことを証します。</p>' +
    '<p style="padding-left:2em">' + esc(wareki(k.date)) + '</p>' +
    '<div class="party"><span>甲：</span><div>〒' + COMPANY.zip + '　' + COMPANY.address + '<br>' + COMPANY.name + '<br>' + COMPANY.ceo + '</div><span style="align-self:end">印</span></div>' +
    '<div class="party" style="margin-top:22px"><span>乙：</span><div>' + (otsuAddr || '<br>') + '<br>' + (otsuName || '<br>') + '</div><span style="align-self:end">印</span></div></div></div>';
}

load();
</script>

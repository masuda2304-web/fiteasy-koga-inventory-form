<title>在庫個数入力 | フィットイージー古河店 備品管理</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="style.css" />

<header>
  <div class="eyebrow">FIT EASY 古河店 / 倉庫管理</div>
  <h1>在庫個数入力</h1>
  <div class="sub">棚にある実際の個数を1品目ずつ入力してください</div>
</header>

<main>
  <a class="back no-print" href="index.html">← メニューに戻る</a>

  <div class="card freq-tabs" id="freq-tabs">
    <button type="button" class="freq-tab active" data-freq="daily">毎日チェック</button>
    <button type="button" class="freq-tab" data-freq="weekly">毎週チェック</button>
    <button type="button" class="freq-tab" data-freq="monthly">毎月チェック</button>
  </div>

  <div id="time-notice"></div>

  <div class="card">
    <label for="staff">担当者</label>
    <select id="staff"><option value="">読み込み中...</option></select>
  </div>

  <div id="list">読み込み中...</div>

  <button class="menu-btn" id="submit-btn">この内容で登録する</button>
  <div id="msg"></div>
</main>

<script src="app.js"></script>
<script>
  let cfg;
  let items = [];
  let currentFreq = "daily";
  const FREQ_LABEL = { daily: "毎日", weekly: "毎週", monthly: "毎月" };

  function isFridayJst(d) {
    return d.getDay() === 5;
  }

  function isLastFridayOfMonthJst(d) {
    if (!isFridayJst(d)) return false;
    const next = new Date(d);
    next.setDate(d.getDate() + 7);
    return next.getMonth() !== d.getMonth();
  }

  function updateFreqNotice() {
    const el = document.getElementById("time-notice");
    const d = nowJstDate();

    if (currentFreq === "daily") {
      const m = nowMinutesOfDay();
      const inWindow =
        (m >= 12 * 60 + 30 && m <= 13 * 60) ||
        (m >= 18 * 60 + 30 && m <= 19 * 60 + 30);
      el.innerHTML = inWindow
        ? ""
        : '<div class="notice warn">毎日チェックは12:30〜13:00 または 18:30〜19:30 のいずれかの実施を推奨しています(1日1回)。時間外でも入力は可能です。</div>';
      return;
    }

    if (currentFreq === "weekly") {
      el.innerHTML = isFridayJst(d)
        ? '<div class="notice ok">本日は毎週チェックの推奨日(金曜日)です。</div>'
        : '<div class="notice warn">毎週チェックは毎週金曜日の実施を推奨しています。今日は金曜日ではありませんが、入力は可能です。</div>';
      return;
    }

    if (currentFreq === "monthly") {
      el.innerHTML = isLastFridayOfMonthJst(d)
        ? '<div class="notice ok">本日は毎月チェックの推奨日(月末最終金曜日)です。</div>'
        : '<div class="notice warn">毎月チェックは月末最終金曜日の実施を推奨しています。今日はその日ではありませんが、入力は可能です。</div>';
      return;
    }

    el.innerHTML = "";
  }

  function onQtyInput(e) {
    const input = e.target;
    const row = input.closest(".item-row");
    const min = Number(input.dataset.min);
    const val = Number(input.value);
    if (input.value !== "" && val < min) {
      row.classList.add("low");
    } else {
      row.classList.remove("low");
    }
  }

  function renderItems() {
    const listEl = document.getElementById("list");
    const visible = items.filter((it) => (it.frequency || "daily") === currentFreq);

    if (visible.length === 0) {
      listEl.innerHTML = `<p style="color:var(--muted)">「${FREQ_LABEL[currentFreq]}チェック」に設定されている品目はまだありません。</p>`;
      return;
    }

    const shelves = {};
    visible.forEach((it) => {
      const shelf = it.shelf || "その他";
      if (!shelves[shelf]) shelves[shelf] = [];
      shelves[shelf].push(it);
    });

    let html = "";
    Object.keys(shelves).forEach((shelf) => {
      html += `<div class="shelf-title">${shelf}</div>`;
      shelves[shelf].forEach((it) => {
        html += `
          <div class="item-row" data-id="${it.id}">
            <div class="name">${it.name} <span class="unit">(${it.unit} / 最低在庫 ${it.min_stock}${it.unit})</span></div>
            <input type="number" min="0" step="1" data-id="${it.id}" data-min="${it.min_stock}" />
          </div>`;
      });
    });
    listEl.innerHTML = html;

    listEl.querySelectorAll("input[type=number]").forEach((input) => {
      input.addEventListener("input", onQtyInput);
    });
  }

  function switchFreq(freq) {
    currentFreq = freq;
    document.querySelectorAll(".freq-tab").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.freq === freq);
    });
    document.getElementById("msg").innerHTML = "";
    renderItems();
    updateFreqNotice();
  }

  async function init() {
    cfg = requireConfigOrRedirect();
    if (!cfg) return;

    document.querySelectorAll(".freq-tab").forEach((btn) => {
      btn.addEventListener("click", () => switchFreq(btn.dataset.freq));
    });

    updateFreqNotice();
    setInterval(updateFreqNotice, 60000);

    const listEl = document.getElementById("list");
    try {
      const [{ data: itemsData }, { data: staffData }] = await Promise.all([
        ghGetJson(cfg, "items.json"),
        ghGetJson(cfg, "staff.json"),
      ]);

      items = itemsData.items || [];
      renderItems();

      const staffEl = document.getElementById("staff");
      staffEl.innerHTML = (staffData.staff || [])
        .map((name) => `<option value="${name}">${name}</option>`)
        .join("");
    } catch (e) {
      listEl.innerHTML = `<p style="color:var(--danger)">読み込みに失敗しました: ${e.message}</p>`;
    }
  }

  async function submit() {
    const msgEl = document.getElementById("msg");
    const staff = document.getElementById("staff").value;
    if (!staff) {
      msgEl.innerHTML = '<div class="notice error">担当者を選択してください。</div>';
      return;
    }

    const inputs = document.querySelectorAll("#list input[type=number]");
    if (inputs.length === 0) {
      msgEl.innerHTML = `<div class="notice error">「${FREQ_LABEL[currentFreq]}チェック」に設定されている品目がないため、登録できません。</div>`;
      return;
    }

    const counts = {};
    let missing = false;
    inputs.forEach((input) => {
      const id = input.dataset.id;
      if (input.value === "") {
        missing = true;
        return;
      }
      counts[id] = Number(input.value);
    });

    if (missing) {
      msgEl.innerHTML = '<div class="notice error">すべての品目の個数を入力してください。</div>';
      return;
    }

    const date = todayDateStr();
    const time = nowTimeStr();
    const fileName = `${date}_${time.replace(":", "")}_${randSuffix()}.json`;
    const body = { date, time, staff, frequency: currentFreq, counts };

    msgEl.innerHTML = '<div class="notice warn">送信中...</div>';
    try {
      await ghCreateJson(
        cfg,
        `counts/${fileName}`,
        body,
        `在庫個数入力(${FREQ_LABEL[currentFreq]}) ${date} ${time} (${staff})`
      );
      msgEl.innerHTML = `<div class="notice ok">「${FREQ_LABEL[currentFreq]}チェック」分を登録しました。最低在庫を下回った品目や、前回から大きく個数が変わった品目があれば、まもなく店長のChatworkに通知されます。</div>`;
    } catch (e) {
      msgEl.innerHTML = `<div class="notice error">送信に失敗しました: ${e.message}</div>`;
    }
  }

  document.getElementById("submit-btn").addEventListener("click", submit);
  mountStatusBar();
  init();
</script>
